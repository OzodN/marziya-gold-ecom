acceptance_criteria:
  - "Direct browser-to-R2 upload is implemented via S3 presigned PUT URL in admin-api.ts and ProductEditor.tsx."
  - "Presigned upload handles content-type and filename, directly PUTting binary to Cloudflare R2 without backend proxying."
  - "Graceful fallback to server upload (/admin/media/upload) is maintained if direct R2 upload fails or in offline dev."
  - "Custom image loader (imageLoader.ts) formats URLs with Cloudflare Image Transformations (/cdn-cgi/image/width=W,quality=Q,format=auto/PATH)."
  - "next.config.ts is configured with loader: 'custom' and loaderFile: './src/imageLoader.ts'."
  - "External fallback URLs (e.g. Unsplash, data URIs, SVGs) are preserved without breaking."
  - "Unit tests for imageLoader verify transformations across relative paths, full media domain URLs, and external fallbacks."
  - "npm test passes (all suites green) and npm run build succeeds cleanly."
