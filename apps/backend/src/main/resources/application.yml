server:
  port: ${PORT:8080}

spring:
  application:
    name: marziya-gold-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  datasource:
    url: ${JDBC_DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/marziya_gold}}
    username: ${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
    password: ${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

application:
  security:
    jwt:
      secret: ${JWT_SECRET:marziyaGoldSecretKeyMustBeAtLeast32BytesLongForHmacSha256}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}
      cookie-name: access_token
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  rate-limiting:
    inquiries:
      capacity: 5
      refill-tokens: 5
      refill-duration-minutes: 1
app:
  r2:
    endpoint: ${R2_ENDPOINT:https://example.r2.cloudflarestorage.com}
    access-key-id: ${R2_ACCESS_KEY_ID:test-key}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:test-secret}
    bucket: ${R2_BUCKET:marziya-media}
    region: ${R2_REGION:auto}
    public-url: ${NEXT_PUBLIC_MEDIA_URL:https://media.marziyagold.uz}

